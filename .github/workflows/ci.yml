name: coverage-ci

# The live assessment needs the whole Wazuh lab, which is too heavy for CI.
# CI instead guards the parts that do not need a lab: the coverage scorer's
# logic, the technique list, the shape of the committed Navigator layer, and the
# threat hunt's logic (run over small Zeek log fixtures). A change that would
# mislabel a technique, break Navigator import, or make the hunt miss a C2 or
# flag benign traffic fails here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Scorer and layer checks
        run: python -m pytest coverage/tests -q
      - name: Threat-hunt logic checks
        run: python -m pytest network/tests -q
      - name: Incident-timeline checks
        run: python -m pytest ir/tests -q
