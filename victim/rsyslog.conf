# Minimal rsyslog for a container. There is no kernel log to read, so only
# the local socket that programs write to is loaded.
module(load="imuxsock")

# Classic "Oct 19 23:40:01 victim sshd[42]: ..." lines, which every Wazuh
# syslog decoder understands.
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

auth,authpriv.*                 /var/log/auth.log
*.*;auth,authpriv.none          /var/log/syslog
